# MGate web image — nginx config. Runs as a non-root user (see docker/web/Dockerfile), so no
# `user` directive here (there is no privileged master process to drop from) and the pid file
# goes to /tmp, which every base image leaves world-writable.
pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # stdout/stderr, not files under /var/log (unwritable by the non-root user, and containers
    # should log to the platform anyway).
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Security headers kept consistent with the headers the backend sets on its own pages,
    # so the two never disagree in deployments that route some paths through Traefik to `api` and others to `web`.
    #
    # nginx gotcha (do not "simplify" this back to one server-level block): `add_header` is
    # inherited from the parent context only if the current context defines NO `add_header` of
    # its own. Every location below also sets its own Cache-Control via `add_header`, which
    # would silently drop these four if they lived at the `server` level instead — so they are
    # repeated in every location that sets a cache header.
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Rendered by entrypoint.sh into /tmp (the only writable path — the container runs with
        # a read-only root filesystem, docker-compose.yml) from env at container start; `alias`
        # (not `root`/try_files) points this location straight at that tmpfs file. Never cache
        # it, and never let a stale copy survive a redeploy with different
        # MGATE_API_BASE_URL/brand settings.
        location = /config.json {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
            add_header Cache-Control "no-store" always;
            alias /tmp/config.json;
        }

        # The SPA shell must always be revalidated so a new deployment's hashed asset
        # references are picked up immediately. Also matches the `try_files ... /index.html`
        # fallback below (an internal redirect re-runs location matching against /index.html).
        location = /index.html {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
            add_header Cache-Control "no-store" always;
        }

        # Vite emits content-hashed filenames under /assets/ — safe to cache forever.
        location /assets/ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # SPA fallback: unknown paths (client-side routes) serve index.html; the backend's own
        # /api/v1/*, /internal/v1/*, /.well-known/* and autoconfig/autodiscover paths never
        # reach this container — Traefik routes them to `api`/`webmail` first.
        location / {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
            try_files $uri /index.html;
        }
    }
}
