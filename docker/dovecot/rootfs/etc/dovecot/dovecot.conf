# MGate Dovecot configuration (Dovecot 2.4 / Pigeonhole 2.4, Debian trixie).
#
# Static parts live in conf.d/*.conf (baked into the image). Environment-dependent values and
# secrets are rendered at container start by /usr/local/bin/mgate-dovecot-init into
# /etc/dovecot/mgate/runtime.conf.ext (0640 root:dovecot), included last so it wins.
# Validate with: doveconf -n     Docs: docs/mail/dovecot.md

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols {
  imap = yes
  pop3 = yes
  lmtp = yes
  sieve = yes
}

# IPv4 only inside the container (compose networks are IPv4); TODO(S8): dual-stack for k8s.
listen = *

# Rendered at start: MGATE_HOSTNAME.
hostname = localhost.localdomain
login_greeting = MGate ready.

# Logs go to syslog (/dev/log, served by mgate-agent -> stdout + Valkey stream mgate:logs).
# MGATE_LOG_STDOUT=1 switches to log_path = /dev/stderr (rendered).
log_path = syslog
syslog_facility = mail
auth_verbose = no

!include conf.d/*.conf
!include_try /etc/dovecot/mgate/runtime.conf.ext
