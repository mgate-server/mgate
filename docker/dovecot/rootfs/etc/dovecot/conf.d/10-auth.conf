##
## Authentication
##
# passdb: Lua script -> mgate API (POST http://api:8081/internal/v1/dovecot/passdb).
# userdb: PostgreSQL view v_dovecot_userdb (role mgate_mail) so LMTP delivery does not depend
#         on the API being up.
# Auth policy (brute force / bans): http://api:8081/internal/v1/dovecot/policy.
# The pgsql connection, lua_settings (token), policy header and nonce are rendered into
# /etc/dovecot/mgate/runtime.conf.ext.

auth_mechanisms {
  plain = yes
  login = yes
}
# Cleartext mechanisms only over TLS (or from login_trusted_networks / loopback).
auth_allow_cleartext = no
auth_username_format = %{user | lower}
auth_failure_delay = 2 secs
auth_cache_size = 10M
auth_cache_ttl = 5 mins
auth_cache_negative_ttl = 1 min
auth_cache_verify_password_with_worker = yes

passdb lua {
  lua_file = /etc/dovecot/lua/mgate-passdb.lua
  use_worker = yes
}

sql_driver = pgsql

userdb sql {
  # Column contract (view v_dovecot_userdb): username, domain, local_part, home, maildir, uid, gid,
  # quota_bytes, status. quota_bytes NULL/0 = unlimited.
  query = SELECT home, uid, gid, \
      CASE WHEN quota_bytes IS NULL OR quota_bytes <= 0 THEN 'unlimited' \
           ELSE quota_bytes::text || 'B' END AS quota_storage_size \
    FROM v_dovecot_userdb WHERE username = '%{user}'
  # doveadm -A / doveadm user '*'
  iterate_query = SELECT username AS user FROM v_dovecot_userdb
  # Never answered from the auth cache: the view lists only mailboxes and domains that are not
  # disabled, so a login (IMAP/POP3/ManageSieve) or LMTP delivery of a mailbox disabled a moment
  # ago fails at once, even while its credentials are still in the auth cache (auth_cache_ttl).
  # One indexed query per login/delivery.
  use_cache = no
}

# Auth policy server: asked before (rate limit, IP ban) and told after each attempt.
# auth_policy_server_url / _api_header / _hash_nonce are rendered (they need the token), so a
# config without runtime.conf.ext (image build, sievec) simply has the policy disabled.
# The before-auth check reserves the attempt and the report settles it, so a second check after
# authentication would reserve twice (a right password at the threshold would be refused).
auth_policy_hash_mech = sha256
auth_policy_reject_on_fail = no
auth_policy_check_before_auth = yes
auth_policy_check_after_auth = no
auth_policy_report_after_auth = yes
# Added to Dovecot's default request attributes (login, pwhash, remote, device_id, protocol,
# session_id, fail_type). The listener port tells the policy server which logins arrived on the
# internal webmail listener (1143); the real_* values come from the TCP connection itself, never
# from a trusted client's IMAP ID (x-connected-port / x-originating-ip).
auth_policy {
  request_attributes {
    real_rip = %{real_remote_ip}
    local_port = %{real_local_port}
  }
}

service auth {
  # SASL for Postfix (smtpd_sasl_path = inet:dovecot:12345). Backend network only.
  inet_listener sasl {
    port = 12345
  }
}

service auth-worker {
  # The Lua passdb only talks HTTP; no need for root.
  user = $SET:default_internal_user
}
