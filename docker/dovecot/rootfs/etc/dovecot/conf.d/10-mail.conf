##
## Mail storage: Maildir under /var/vmail/<domain>/<local>/Maildir, owned by vmail (5000:5000)
##

mail_driver = maildir
mail_path = ~/Maildir
# Fallback home when a userdb row has none (v_dovecot_userdb always returns it).
mail_home = /var/vmail/%{user | domain}/%{user | username}
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
last_valid_uid = 5000
first_valid_gid = 5000
last_valid_gid = 5000

mailbox_list_index = yes
maildir_very_dirty_syncs = yes
mail_max_userip_connections = 20
recipient_delimiter = +

# Attachment detection: tag messages with the $HasAttachment / $HasNoAttachment keywords when
# they are saved (LMTP delivery, APPEND) and on fetch when it is cheap, so IMAP clients and the
# webmail message list can show a paperclip without downloading the body structure. Detached
# signatures (application/pgp-signature, application/pkcs7-signature, ...; wildcard match) do
# not count as attachments.
mail_attachment_detection_options = add-flags content-type=!application/*-signature

mail_plugins {
  quota = yes
}

namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  # Apple Mail default name; not auto-created.
  mailbox "Sent Messages" {
    special_use = \Sent
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
    autoexpunge = 30 days
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
    autoexpunge = 30 days
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

##
## Quota: per-user limit from userdb (quota_storage_size), tracked in indexes (count driver).
##
quota "User quota" {
  driver = count
}
# Let the user empty Trash even when over quota.
namespace inbox {
  mailbox Trash {
    quota_storage_extra = 100M
  }
}
protocol !indexer-worker {
  mail_vsize_bg_after_count = 100
}
# TODO(S1): quota warnings (80%/95%) -> quota-warning script service that notifies the user
#   (and POST /internal/v1/events/dovecot), e.g.
#   quota "User quota" { warning warn-95 { quota_storage_percentage = 95
#     execute quota-warning { args = 95 %{user} } } }

# quota-status policy service for Postfix (check_policy_service inet:dovecot:12340).
quota_status_success = DUNNO
quota_status_nouser = DUNNO
quota_status_overquota = "552 5.2.2 Mailbox is full"
# Message larger than the whole quota (2.4.1 answers an empty action when this is unset).
quota_status_toolarge = "552 5.2.3 Message is larger than the mailbox quota"
service quota-status {
  executable = quota-status -p postfix
  inet_listener quota-status {
    port = 12340
  }
  client_limit = 1
}
