##
## Full-text search: fts_flatcurve (Xapian), package dovecot-flatcurve
##

mail_plugins {
  fts = yes
  fts_flatcurve = yes
}

fts flatcurve {
  # Substring (infix) search makes indexes much larger; prefix search is the default.
  substring_search = no
}

fts_autoindex = yes
fts_autoindex_max_recent_msgs = 999
fts_search_add_missing = yes

# Russian UI is the default; English second. Language detection picks per message.
language_tokenizers = generic email-address
language_tokenizer_generic_algorithm = simple
language ru {
  default = yes
  filters = lowercase snowball stopwords
}
language en {
  filters = lowercase snowball english-possessive stopwords
}

# Junk and Trash are not worth indexing.
namespace inbox {
  mailbox Junk {
    fts_autoindex = no
  }
  mailbox Trash {
    fts_autoindex = no
  }
}
# TODO(S5): attachment text extraction (fts_decoder_driver = script + decode2text) for the
# webmail "search in attachments" requirement.
