##
## TLS
##
# /certs/default is written by mgate (ACME / uploaded cert) or bootstrapped self-signed by
# mgate-dovecot-init; mgate-agent runs `doveadm reload` when it changes.
# ssl = required: authentication needs TLS (implicit on 993/995 or STARTTLS on 143/110/4190);
# login_trusted_networks (backend subnet, rendered) and loopback count as secured.
ssl = required
ssl_server_cert_file = /certs/default/fullchain.pem
ssl_server_key_file = /certs/default/privkey.pem
ssl_min_protocol = TLSv1.2
# TLS 1.2 ciphers: Mozilla "intermediate" without DHE (no DH parameters configured).
# TLS 1.3 suites are OpenSSL defaults and are preferred automatically.
ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
ssl_server_prefer_ciphers = client
