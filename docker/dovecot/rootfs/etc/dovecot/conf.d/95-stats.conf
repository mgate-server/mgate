##
## Statistics (OpenMetrics on :9900, scraped via /metrics) and event export to mgate
##

service stats {
  inet_listener http {
    port = 9900
  }
}

metric auth_success {
  filter = event=auth_request_finished AND success=yes
}
metric auth_failure {
  filter = event=auth_request_finished AND NOT success=yes
}
metric imap_command {
  filter = event=imap_command_finished
  group_by cmd_name {
  }
}
metric mail_delivery {
  filter = event=mail_delivery_finished
}

# Auth events -> mgate API (login journal / live logs). http_post_url is rendered with
# credentials (see runtime.conf.ext): the http-post driver cannot add custom headers, so the
# internal token is sent as HTTP Basic auth (user "dovecot") embedded in the URL.
event_exporter mgate {
  driver = http-post
  http_post_url = http://api:8081/internal/v1/events/dovecot
  format = json
  time_format = rfc3339
  http_client_request_absolute_timeout = 2 secs
}
metric auth_events_export {
  exporter = mgate
  exporter_include = name hostname timestamps fields
  filter = event=auth_request_finished
}
