##
## Services and listeners
##
# Public (published by compose): 143 imap, 993 imaps, 110 pop3, 995 pop3s, 4190 managesieve.
# Backend only (not published): 1143 imap for the webmail gateway, 24 lmtp, 12345 auth
# (conf.d/10-auth.conf), 12340 quota-status (conf.d/10-mail.conf), 8080 doveadm HTTP API,
# 9900 openmetrics (conf.d/95-stats.conf).

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  # Internal IMAP listener for the webmail gateway only (STARTTLS, same TLS settings as 143).
  # Never published to the host (compose) and reachable only from webmail pods (Helm
  # NetworkPolicy). The passdb tells the API which listener a login arrived on (real local
  # port), and the API accepts the gateway's per-session credentials only here.
  inet_listener imap-webmail {
    port = 1143
  }
  # TODO(S8): behind a TCP load balancer (k8s) add HAProxy PROXY-protocol listeners, e.g.
  #   inet_listener imap_haproxy { port = 10143  haproxy = yes }
  # and set haproxy_trusted_networks to the load balancer's addresses.
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

service lmtp {
  # Postfix: virtual_transport = lmtp:inet:dovecot:24 (backend network).
  inet_listener lmtp {
    port = 24
  }
}

service doveadm {
  # HTTP API for the mgate backend (Authorization: X-Dovecot-API <base64 DOVEADM_API_KEY>).
  inet_listener http {
    port = 8080
  }
}

# Dovecot's built-in auth penalty is off: after failed logins anvil delays every further
# authentication from the same IP (2, 4, 8, up to 15 s), even one with the correct password. Every
# webmail send authenticates from the gateway's single address (SMTP AUTH via Postfix 2587), so a
# few failures there would stall all webmail users past Postfix's 10 s SASL timeout; users behind
# a NAT address shared with a password guesser would get slow or timed-out logins. Brute force is
# handled by mgate's auth policy instead (conf.d/10-auth.conf: per-IP and per-login failure
# counters, delays and bans), and auth_failure_delay still delays each failure. Without this
# socket the auth process skips the penalty lookup (checked on 2.4.1).
service anvil {
  unix_listener anvil-auth-penalty {
    mode = 0
  }
}

service imap {
  vsz_limit = 512M
}

service indexer-worker {
  # Xapian (fts_flatcurve) indexing of large mailboxes needs more than the default.
  vsz_limit = 1G
}
