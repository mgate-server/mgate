##
## Sieve (Pigeonhole 2.4): LMTP delivery filters, ManageSieve, IMAPSieve spam/ham learning
##

# Personal scripts, managed by users (ManageSieve :4190) or generated by mgate
# (the backend's sieve module: filters, vacation, forwarding) and uploaded via ManageSieve.
sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

# Global script executed before the personal one: Rspamd-flagged spam -> Junk.
# Compiled at image build time (sievec) because vmail cannot write to /etc/dovecot/sieve.
sieve_script spam-to-junk {
  type = before
  path = /etc/dovecot/sieve/before.d/10-spam-to-junk.sieve
}

sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}

# vnd.dovecot.pipe is only available to global (admin-controlled) scripts.
sieve_global_extensions {
  vnd.dovecot.pipe = yes
  vnd.dovecot.environment = yes
}
sieve_pipe_bin_dir = /usr/local/lib/dovecot/sieve-pipe

# Forwarded (redirected) mail keeps SPF alignment by using the original recipient as the
# envelope sender. TODO(S1): SRS in Postfix/Rspamd for full DMARC-safe forwarding.
sieve_redirect_envelope_from = orig_recipient
sieve_max_redirects = 4
sieve_vacation_min_period = 1 days
sieve_vacation_default_period = 7 days

# IMAPSieve: moving a message INTO Junk teaches Rspamd "spam", moving it OUT of Junk teaches
# "ham" (report-ham.sieve ignores moves to Trash). Learning is done by
# /usr/local/lib/dovecot/sieve-pipe/rspamd-learn -> Rspamd controller :11334.
mailbox Junk {
  sieve_script report-spam {
    type = before
    cause = copy
    path = /etc/dovecot/sieve/report-spam.sieve
  }
}
imapsieve_from Junk {
  sieve_script report-ham {
    type = before
    cause = copy
    path = /etc/dovecot/sieve/report-ham.sieve
  }
}
