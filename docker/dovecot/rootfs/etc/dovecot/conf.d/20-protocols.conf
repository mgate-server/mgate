##
## Per-protocol settings
##

protocol imap {
  mail_plugins {
    imap_quota = yes
    imap_sieve = yes
  }
  imap_idle_notify_interval = 2 mins
}

protocol pop3 {
  # Outlook/Thunderbird friendly UIDLs; stable across Maildir renames.
  pop3_uidl_format = %{uidvalidity | hex(8)}%{uid | hex(8)}
}

protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}
# Reject at RCPT time (Postfix keeps the mail queued / bounces properly) when over quota.
lmtp_rcpt_check_quota = yes
lmtp_save_to_detail_mailbox = no

protocol sieve {
  managesieve_max_line_length = 65536
}

# Mail generated by Dovecot itself (Sieve redirect/vacation, rejects) is submitted to Postfix
# on port 25 from the backend network (in Postfix mynetworks).
submission_host = postfix:25
# postmaster_address is rendered (postmaster@MGATE_HOSTNAME).
