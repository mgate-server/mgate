#!/usr/sbin/nft -f
# Base ruleset for the MGate firewall container. Loaded once at container start by entrypoint.sh
# (`nft -f`); mgate-agent --role firewall only ever adds/removes *elements* of the `mgate_ban`
# set afterwards (never redefines the table/chain), driven by Valkey `mgate:bans`/
# `mgate:bans:events`.
#
# A separate table (not "filter"/"inet filter" as many distros' default firewall uses) so this
# never collides with, or has to understand, whatever other nftables/iptables rules already exist
# on the host (network_mode: host) — every table's base chains run independently at the same hook.
#
# TODO(S2): IPv6 support — add a second set `mgate_ban6` (type ipv6_addr) and a matching drop rule
# once mgate-agent emits/consumes IPv6 addresses for bans (only `mgate_ban` exists today).

table inet mgate_filter {
	set mgate_ban {
		type ipv4_addr
		flags interval
		comment "IPs banned via mgate:bans (Valkey) — managed at runtime by mgate-agent"
	}

	chain input {
		# Very early priority so a ban always wins regardless of what else runs on this host.
		type filter hook input priority -150; policy accept;
		ip saddr @mgate_ban counter drop
	}
}
