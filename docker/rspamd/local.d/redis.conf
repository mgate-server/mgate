## MGate: shared Redis/Valkey backend for every module that supports one
## (bayes classifier, DKIM/ARC key storage, greylisting, multimap allow/deny
## lists, history_redis, dmarc reporting, ratelimit if enabled later).
## By design rspamd always talks to Valkey db 1
## (`redis://valkey:6379/1`); db 0 is reserved for the mgate backend.
##
## Values come from Rspamd's env-templating (RSPAMD_-prefixed OS env vars
## exposed as `env.*`, see https://docs.rspamd.com/configuration/templates/).
## The compose/infra layer must set, for the rspamd service:
##   RSPAMD_REDIS_HOST=valkey
##   RSPAMD_REDIS_PORT=6379          (optional, defaults below)
##   RSPAMD_REDIS_PASSWORD=${VALKEY_PASSWORD}
##   RSPAMD_REDIS_DB=1               (optional, defaults below)
servers = "{= env.REDIS_HOST | default "valkey" =}:{= env.REDIS_PORT | default "6379" =}";
{% if env.REDIS_PASSWORD %}
password = "{= env.REDIS_PASSWORD =}";
{% endif %}
db = "{= env.REDIS_DB | default "1" =}";
timeout = 5s;
