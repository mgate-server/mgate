## MGate: Bayes classifier, Redis-backed (shared Valkey db 1, see
## local.d/redis.conf) so all mgate instances behind the same DB share
## learning state, and so "Mark as spam/ham" actions from the webmail UI
## (backend -> rspamc learn_spam/learn_ham) persist across restarts.
tokenizer {
    name = "osb";
}

backend = "redis";
new_schema = true;
min_tokens = 11;
min_learns = 200;

statfile {
    symbol = "BAYES_HAM";
    spam = false;
}
statfile {
    symbol = "BAYES_SPAM";
    spam = true;
}

# Shared learn-guard helper (Rspamd 3.14+); keeps manual and automatic
# learns from fighting each other on borderline scores.
learn_condition = "return require('lua_bayes_learn').can_learn";

autolearn {
    spam_threshold = 6.0;
    ham_threshold = -0.5;
    check_balance = true;
    min_balance = 0.9;
}
