## MGate: default score thresholds. Deliberately conservative for the first releases;
## revisit once deliverability testing (docs/TESTING.md, mail-tester.com
## 10/10 target) gives real-world score distributions.
## Exposed to the admin UI (Security page, TODO(S4)) for per-instance
## tuning -- mgate should write these back into override.d at runtime
## rather than editing local.d (keeps this file as the documented default).
## NOTE: this file's content is already merged inside the top-level
## `actions { ... }` section by rspamd.conf -- do not add another
## `actions { }` wrapper here or the config fails with a "nested section"
## error (verified with `rspamadm configtest`).
reject = 15;
add_header = 6;
greylist = 4; # triggers the "soft reject" action, see local.d/greylist.conf
