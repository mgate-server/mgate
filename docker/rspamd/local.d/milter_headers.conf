## MGate: headers added to every message on its way through the Milter
## proxy (worker-proxy.inc). Consumed downstream by:
##  - Dovecot Pigeonhole sieve_before rule that files spam into Junk based
##    on X-Spam / X-Spamd-Result (docker/dovecot);
##  - the webmail SPF/DKIM/DMARC indicator (the webmail service parses
##    Authentication-Results -- see docs/mail/rspamd.md).
extended_spam_headers = true; # adds x-spamd-result, x-rspamd-server, x-rspamd-queue-id, x-rspamd-action
use = ["authentication-results", "x-spamd-bar"];

## Also stamp these on mail from authenticated (webmail/SMTP submission)
## users -- normally suppressed for local senders since they don't need
## anti-spam feedback, but the webmail UI's SPF/DKIM indicator wants
## Authentication-Results consistently present on outbound copies too
## (e.g. a mailbox that IMAP-appends its own Sent copy).
authenticated_headers = ["authentication-results"];
skip_authenticated = false;

## Always stamp Authentication-Results, also for clients in local_addrs
## (options.inc). skip_local would otherwise drop it for every "local" peer,
## and behind rootless Docker / NAT'd load balancers that can be every
## inbound connection. The authserv-id is Postfix's {daemon_name} milter
## macro: MGATE_HOSTNAME on port 25 (main.cf milter_macro_daemon_name),
## ORIGINATING on the submission listeners. Postfix strips incoming A-R
## headers that claim MGATE_HOSTNAME before this milter runs (header_checks,
## docs/mail/postfix.md), so the topmost MGATE_HOSTNAME header is always ours.
local_headers = ["authentication-results"];

routines {
    x-spamd-bar {
        # Keep the visual bar readable in raw-header views; no change to
        # symbol scoring semantics.
        positive = "+";
        negative = "-";
        neutral = "/";
    }
}
