## MGate: ship every scan verdict to the mgate backend's internal event
## ingest endpoint (used for Live Logs / stats rollups, `mail_events`
## table).
##
## Authentication: the stock `http` backend only speaks HTTP Basic, so the
## internal token travels as the Basic password (user `rspamd`). The internal
## API otherwise uses `Authorization: Bearer` on /internal/v1/*; a custom Lua pusher
## calling rspamd_http.request directly (which is the only way to set a
## bearer header here) reliably SEGFAULTS the scan worker in Rspamd 4.1.5
## -- every scanned message killed the `normal`/`rspamd_proxy` process, so
## Postfix got "can't read SMFIC_BODYEOB reply packet header" and submission
## tempfailed. Verified: same config with the stock backend scans fine.
## /internal/v1/events/dovecot already has to accept Basic for the same
## reason (Dovecot's http-post exporter cannot set custom headers), so the
## internal API accepts Basic on both event endpoints.
## TODO(S1): revisit a bearer-capable pusher once the Rspamd crash is fixed
## upstream (report filed against 4.1.5 behaviour).
##
## NOTE: this file's content is already merged inside the top-level
## `metadata_exporter { ... }` section by rspamd.conf -- do not add another
## `metadata_exporter { }` wrapper here or the config fails with a "nested
## section" error (verified with `rspamadm configtest`).
rules {
    MGATE_EVENTS {
        backend = "http";
        url = "{= env.EVENTS_URL | default "http://api:8081/internal/v1/events/rspamd" =}";
        selector = "default"; # every scanned message, not just spam/reject
        formatter = "json";
        user = "rspamd";
        password = "{= env.INTERNAL_TOKEN =}";
    }
}
