## MGate: keep the WebUI "History" tab working across controller restarts
## by persisting it to the shared Valkey (inherits connection from
## local.d/redis.conf). Small, bounded, purely operational -- distinct from
## metadata_exporter.conf's event stream to the mgate backend, which is
## the source of truth for Live Logs / stats.
nrows = 2000;
expire = 432000; # 5 days
compress = true;
