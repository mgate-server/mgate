## MGate: admin-managed allow/deny lists. Backed by Valkey hashes (db 1,
## same Redis connection as local.d/redis.conf) that the `mgate` backend
## (admin UI "Security" section, TODO(S4)) writes directly
## with HSET/HDEL -- no rspamadm/controller map-editing round-trip needed.
##
## Redis map protocol (see https://docs.rspamd.com/modules/multimap/):
## `map = "redis://<hashkey>"` reads a Rspamd Redis map, where presence of
## the looked-up value as a field in the hash `<hashkey>` (HSET <hashkey>
## <value> 1) means "match". Exact hash key names below are a stable
## stable interface -- the mgate backend reads/writes them by this literal
## name:
##   rspamd:mm:senders:allow   -- envelope-from addresses, always accepted
##   rspamd:mm:senders:deny    -- envelope-from addresses, always rejected
##   rspamd:mm:rcpt:deny       -- envelope-to addresses, always rejected
##   rspamd:mm:ip:allow        -- sender IPs/CIDRs, always accepted
##   rspamd:mm:ip:deny         -- sender IPs/CIDRs, always rejected
## (IP maps use Rspamd's radix-map semantics; HSET the CIDR/IP as the field
## name, e.g. HSET rspamd:mm:ip:deny 203.0.113.0/24 1.)
## TODO(S2): the admin UI/API must enforce that an address/IP is never
## present in both an allow and a deny map at once -- Rspamd does not
## guarantee which prefilter rule wins if both match the same message.

MGATE_SENDER_ALLOW {
    type = "from";
    filter = "email:addr";
    map = "redis://rspamd:mm:senders:allow";
    prefilter = true;
    action = "accept";
    description = "Admin-managed sender allowlist (mgate Security settings)";
}

MGATE_SENDER_DENY {
    type = "from";
    filter = "email:addr";
    map = "redis://rspamd:mm:senders:deny";
    prefilter = true;
    action = "reject";
    message = "Sender blocked by mail server administrator";
    description = "Admin-managed sender denylist (mgate Security settings)";
}

MGATE_RCPT_DENY {
    type = "rcpt";
    filter = "email:addr";
    map = "redis://rspamd:mm:rcpt:deny";
    prefilter = true;
    action = "reject";
    message = "Recipient blocked by mail server administrator";
    description = "Admin-managed recipient denylist (mgate Security settings)";
}

MGATE_IP_ALLOW {
    type = "ip";
    map = "redis://rspamd:mm:ip:allow";
    prefilter = true;
    action = "accept";
    description = "Admin-managed IP allowlist (mgate Security settings)";
}

MGATE_IP_DENY {
    type = "ip";
    map = "redis://rspamd:mm:ip:deny";
    prefilter = true;
    action = "reject";
    message = "Your IP address has been blocked by the mail server administrator";
    description = "Admin-managed IP denylist (mgate Security settings)";
}
