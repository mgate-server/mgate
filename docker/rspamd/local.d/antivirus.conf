## MGate: ClamAV scanning via the `clamav` compose service (profile
## `clamav`, docker/clamav/, port 3310). See docs/mail/antivirus-dns.md.
##
## Graceful degradation when the `clamav` profile is disabled: `servers`
## still points at the service name, so if the container/profile is absent
## DNS resolution or connect() fails per-message. `symbol_fail` is set
## instead of a hard error, and CLAM_VIRUS_FAIL carries a low/neutral score
## by default (no `action` forced on it below) so mail keeps flowing
## without antivirus rather than queueing/deferring everything. Operators
## who want to hard-fail-closed when ClamAV is down should raise
## CLAM_VIRUS_FAIL's score in local.d/actions.conf's per-symbol overrides
## (TODO(S1): expose this as an admin UI toggle, "antivirus.fail_action").
clamav {
    type = "clamav";
    servers = "{= env.CLAMAV_SERVERS | default "clamav:3310" =}";

    symbol = "CLAM_VIRUS";
    symbol_fail = "CLAM_VIRUS_FAIL";

    # Scan attachments individually; skip huge messages rather than block
    # the scanner (must stay <= MGATE_MESSAGE_SIZE_LIMIT so nothing legit
    # is silently unscanned).
    scan_mime_parts = true;
    max_size = {= env.MESSAGE_SIZE_LIMIT | default "52428800" =};

    log_clean = false;

    # EICAR test file support (see tests/deliverability, TODO(S1)).
    patterns {
        JUST_EICAR = "^Eicar-Test-Signature$";
    }
}
