## MGate: ARC sealing. Reuses the exact same Redis-backed key material as
## DKIM signing (same selector per domain, same private key) -- this is a
## deliberate simplification: one keypair per domain serves both
## DKIM-signing and ARC-sealing duties, so the mgate backend only ever writes
## one hash entry per domain. See docs/mail/rspamd.md.
use_redis = true;
key_prefix = "DKIM_KEYS";
selector_prefix = "DKIM_SELECTORS";
selector = "dkim";

sign_authenticated = true;
sign_local = true;
sign_inbound = true; # ARC seals inbound/forwarded mail too (RFC 8617 use case)

use_domain = "header";
use_esld = true;

sign_symbol = "ARC_SIGNED";
