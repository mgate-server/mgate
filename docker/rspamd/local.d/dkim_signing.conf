## MGate: DKIM signing, keys managed entirely by the `mgate` backend in
## Valkey (never on disk) -- see docs/mail/rspamd.md "DKIM/ARC key layout"
## for the exact Redis hash format the mgate backend writes.
##
## Redis layout (db 1, same as everything else in this file):
##   HSET DKIM_KEYS      "<selector>.<domain>"  "<PEM private key>"
##   HSET DKIM_SELECTORS "<domain>"             "<selector>"
## `key_prefix`/`selector_prefix` below are the exact hash names -- treat
## them as a stable interface, the mgate backend reads/writes them by
## this literal name, do not env-template them.
use_redis = true;
key_prefix = "DKIM_KEYS";
selector_prefix = "DKIM_SELECTORS";

## Fallback selector if a domain has no entry in DKIM_SELECTORS yet
## (e.g. right after domain creation, before the backend finishes the DNS
## wizard). Kept generic; mgate always writes a per-domain selector.
selector = "dkim";

sign_authenticated = true;
sign_local = true;
sign_inbound = false;

## Domain used for signing: MIME From header, normalised to eSLD.
use_domain = "header";
use_esld = true;

## Keep Rspamd's own SASL-login-vs-signing-domain check enabled. Postfix's
## reject_sender_login_mismatch (mua_sender_restrictions, sender_login.cf.in)
## only validates the SMTP envelope MAIL FROM, never the RFC5322 From header
## that `use_domain = "header"` above actually signs for -- so it does NOT
## substitute for this check. With allow_username_mismatch = true, a
## mailbox on hosted domain A could submit a message with an RFC5322 From
## on any OTHER hosted domain B and get it DKIM-signed (d=B) with B's real
## key, producing a DMARC-aligned spoof of another tenant's domain.
## TODO(S1): if shared/service mailboxes signing on behalf of a distribution
## list on their OWN domain becomes a real requirement, add an explicit
## per-domain/per-user allowlist keyed off the authenticated SASL identity
## instead of disabling this check globally.
allow_username_mismatch = false;

## Do not sign obviously spoofed/forged messages a second time.
skip_spam_sign = true;

symbol = "DKIM_SIGNED";
