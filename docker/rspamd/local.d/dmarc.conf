## MGate: DMARC policy enforcement is always on; aggregate/failure
## *reporting* (sending rua/ruf reports to other domains) is left disabled
## until mgate has a dedicated outbound relay path for report mail that
## bypasses Rspamd itself (required to avoid the report-mail loop the
## upstream docs warn about) and a per-instance report sender identity.
## TODO(S1): wire `reporting { enabled = true; email = ...; domain = ...;
## org_name = ...; smtp = "postfix"; }` once the backend knows the instance's
## primary domain and Postfix exposes a Rspamd-bypass transport for it.
actions {
    reject = "reject";
    quarantine = "add header";
    softfail = "no action";
}

reporting {
    enabled = false;
}
