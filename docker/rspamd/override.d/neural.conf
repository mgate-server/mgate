## MGate: explicitly keep the neural network module disabled in the initial releases.
## It ships disabled by default upstream too, but we pin it here (in
## override.d, so it wins over any future local.d edit) because it needs
## a trained model + a non-trivial mail volume to be useful, and a
## half-configured neural block silently doing nothing is a common
## source of confusion. Revisit in a later stage once there is enough
## per-instance mail history to train against (see docs/mail/rspamd.md).
enabled = false;
