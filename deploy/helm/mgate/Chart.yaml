apiVersion: v2
name: mgate
description: |
  MGate — self-hosted, containerized mail platform (Postfix + Dovecot 2.4 + Rspamd + ClamAV +
  PostgreSQL + Valkey + a closed-source Rust backend, shipped only as a vendor container image +
  React SPA + Ingress). Kubernetes packaging that mirrors the docker-compose topology of this
  repository. There is exactly one backend build; editions are a runtime property of
  the licence lease, never a compile-time or image choice.
type: application
# version/appVersion are rewritten by the release tooling: one CalVer version (YYYY.M.N, e.g.
# 2026.10.1) for the whole product, equal to the image tags. Do not edit them by hand.
version: 2026.10.2
appVersion: "2026.10.2"
kubeVersion: ">=1.28.0-0"
home: https://github.com/mgate-server/mgate
sources:
  - https://github.com/mgate-server/mgate
keywords:
  - mail
  - smtp
  - imap
  - postfix
  - dovecot
  - rspamd
  - self-hosted
maintainers:
  - name: MGate maintainers
    url: https://github.com/mgate-server/mgate
annotations:
  # No SPDX identifier fits "all rights reserved, narrow EULA-granted usage right" (see
  # docs/adr/0014-license-choice.md) — LicenseRef- is the SPDX convention for a non-standard
  # licence; see ../../LICENSE and ../../EULA.md for the actual terms.
  artifacthub.io/license: LicenseRef-MGate-EULA
