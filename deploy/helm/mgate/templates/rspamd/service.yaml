apiVersion: v1
kind: Service
metadata:
  # Bare Service name — postfix's milter is "inet:rspamd:11332".
  name: rspamd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgate.labels" (dict "root" . "component" "rspamd") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mgate.selectorLabels" (dict "root" . "component" "rspamd") | nindent 4 }}
  ports:
    - { name: milter, port: 11332, targetPort: milter, protocol: TCP }
    - { name: normal, port: 11333, targetPort: normal, protocol: TCP }
    - { name: controller, port: 11334, targetPort: controller, protocol: TCP }
