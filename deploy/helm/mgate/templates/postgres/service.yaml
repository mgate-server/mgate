{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  # Bare Service name — see templates/_helpers.tpl "mgate.postgresHost".
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgate.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "mgate.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres, protocol: TCP }
{{- end }}
