{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mgate.secretsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgate.labels" (dict "root" . "component" "") | nindent 4 }}
  annotations:
    # Documents the lookup-preserve behavior for operators inspecting the object; does not affect
    # Helm's own 3-way merge (helm.sh/resource-policy is intentionally NOT set to "keep" here: on
    # `helm uninstall` this Secret should be removed like everything else — values are preserved
    # across upgrade via the `lookup` in _helpers.tpl "mgate.secretValue", not via resource-policy).
    mgate.io/secret-strategy: generate-and-preserve
type: Opaque
stringData:
  # --- Generated / preserved across upgrades (see templates/_helpers.tpl "mgate.secretValue") ---
  MGATE_SECRET_KEY: {{ include "mgate.secretValue" (dict "root" $ "key" "MGATE_SECRET_KEY" "override" .Values.secrets.secretKey "length" 32) | quote }}
  MGATE_INTERNAL_TOKEN: {{ include "mgate.secretValue" (dict "root" $ "key" "MGATE_INTERNAL_TOKEN" "override" .Values.secrets.internalToken "length" 40) | quote }}
  DOVEADM_API_KEY: {{ include "mgate.secretValue" (dict "root" $ "key" "DOVEADM_API_KEY" "override" .Values.secrets.doveadmApiKey "length" 32) | quote }}
  RSPAMD_CONTROLLER_PASSWORD: {{ include "mgate.secretValue" (dict "root" $ "key" "RSPAMD_CONTROLLER_PASSWORD" "override" .Values.secrets.rspamdControllerPassword "length" 24) | quote }}
  MGATE_ADMIN_PASSWORD: {{ include "mgate.secretValue" (dict "root" $ "key" "MGATE_ADMIN_PASSWORD" "override" .Values.secrets.adminPassword "length" 16) | quote }}
  RESTIC_PASSWORD: {{ include "mgate.secretValue" (dict "root" $ "key" "RESTIC_PASSWORD" "override" .Values.secrets.resticPassword "length" 32) | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
  # ZeroSSL External Account Binding HMAC — a credential like the ones above, so it lives in the
  # Secret rather than the ConfigMap (unlike MGATE_ACME_EAB_KID, which is not sensitive on its own).
  MGATE_ACME_EAB_HMAC: {{ .Values.config.acme.eabHmac | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ include "mgate.postgresPassword" . | quote }}
  {{- end }}
  # Read by Postfix/Dovecot (POSTGRES_MAIL_PASSWORD) regardless of postgresql.enabled: bundled ->
  # generated/preserved here; external -> looked up from externalDatabase.mailExistingSecret (chart
  # cannot generate a password for a database it does not manage). Was previously rendered only
  # inside the `postgresql.enabled` block, so external-DB installs shipped an empty password and
  # Postfix/Dovecot's own pgsql auth against `mgate_mail` failed outright — fixed.
  POSTGRES_MAIL_PASSWORD: {{ include "mgate.postgresMailPassword" . | quote }}
  {{- if .Values.valkey.enabled }}
  VALKEY_PASSWORD: {{ include "mgate.valkeyPassword" . | quote }}
  {{- end }}
  # --- Composed DSNs (compose composes them in docker-compose.yml; this chart sets them here instead) ---
  # NOTE: when postgresql.enabled=false or valkey.enabled=false and the external password comes
  # from a Secret that does not exist yet at install time, the password segment renders empty —
  # re-run `helm upgrade` once the external Secret exists, or pre-create it first.
  MGATE_DATABASE_URL: {{ include "mgate.databaseUrl" . | quote }}
  MGATE_REDIS_URL: {{ include "mgate.redisUrl" . | quote }}
{{- end }}
