apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mgate.fullname" . }}-postfix
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgate.labels" (dict "root" . "component" "postfix") | nindent 4 }}
spec:
  # Bare Service name ("postfix") used as the StatefulSet's governing serviceName too, so pod-0's
  # stable network identity (postfix-0.postfix...) is available if ever needed, even though nothing
  # currently addresses postfix by ordinal (replicaCount stays 1 until TODO(S8)).
  serviceName: postfix
  replicas: {{ .Values.postfix.replicaCount }}
  selector:
    matchLabels:
      {{- include "mgate.selectorLabels" (dict "root" . "component" "postfix") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mgate.selectorLabels" (dict "root" . "component" "postfix") | nindent 8 }}
      {{- with .Values.postfix.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mgate.serviceAccountName" . }}
      # Postfix's s6-overlay entrypoint (/init) runs as root by design (spawns postfix/vmail
      # children, chmods the queue dir) — `global.podSecurityContext` sets `runAsNonRoot: true`,
      # which is right for the mgate/rspamd/unbound images but would make the kubelet refuse to
      # start THIS container at all. See templates/_helpers.tpl "mgate.podSecurityContext".
      securityContext:
        {{- include "mgate.podSecurityContext" (dict "root" . "override" (dict "runAsNonRoot" false)) | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "mgate.dnsConfig" . | nindent 6 }}
      # Postfix reads virtual domains/mailboxes/aliases straight from Postgres views (role
      # mgate_mail) and needs migrate's schema to exist first; the migrate Job hook blocks the
      # rest of the release until it succeeds, so no extra initContainer wait is added here.
      terminationGracePeriodSeconds: 30 # same as compose stop_grace_period for postfix/dovecot
      containers:
        - name: postfix
          image: {{ include "mgate.image" (dict "root" . "repository" .Values.postfix.image.repository "tag" .Values.postfix.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "mgate.configMapName" . }}
            - secretRef:
                name: {{ include "mgate.secretsName" . }}
          env:
            # Source networks admitted on the internal webmail submission listener 2587
            # (docker/postfix: MGATE_WEBMAIL_CLIENT_NETS, image default MGATE_BACKEND_SUBNET).
            # values postfix.webmailClientNets, else config.backendSubnet, else any source: the
            # webmail-only NetworkPolicy is then the network-level guard (see values.yaml).
            - name: MGATE_WEBMAIL_CLIENT_NETS
              value: {{ .Values.postfix.webmailClientNets | default .Values.config.backendSubnet | default "0.0.0.0/0 ::/0" | quote }}
          ports:
            - { name: smtp, containerPort: 25, protocol: TCP }
            - { name: smtps, containerPort: 465, protocol: TCP }
            - { name: submission, containerPort: 587, protocol: TCP }
            # Internal submission for the webmail gateway (not in the public LoadBalancer Service;
            # templates/networkpolicy.yaml admits webmail pods only).
            - { name: smtp-webmail, containerPort: 2587, protocol: TCP }
            - { name: agent, containerPort: 7070, protocol: TCP }
          # Same exec healthcheck as `docker/postfix/Dockerfile`'s own HEALTHCHECK / compose's
          # `test: ["CMD", "/usr/local/bin/mgate-healthcheck"]` (master process alive + a 220
          # banner on :25) — NOT the mgate-agent's `/v1/health` (that only proves the agent
          # sidecar-in-process is up, not Postfix itself). initialDelaySeconds mirrors compose's
          # start_period (60s); interval/timeout/retries mirror its interval/timeout/retries.
          livenessProbe:
            exec: { command: ["/usr/local/bin/mgate-healthcheck"] }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec: { command: ["/usr/local/bin/mgate-healthcheck"] }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            # Mirrors compose `cap_add` for postfix exactly (docker-compose.yml): NET_BIND_SERVICE
            # for 25/465/587, CHOWN/SETUID/SETGID/DAC_OVERRIDE because the master spawns children as
            # postfix/vmail and owns queue files, FOWNER because `postfix check`/set-permissions
            # chmod the queue directories on the spool volume (fails with EPERM without it). The
            # container runs as root (no runAsUser here — see the Pod-level securityContext above),
            # so these capabilities are what actually let it drop privileges safely instead of
            # needing full root the whole time.
            {{- include "mgate.securityContext" (dict "root" . "override" (dict "capabilities" (dict "drop" (list "ALL") "add" (list "NET_BIND_SERVICE" "CHOWN" "SETUID" "SETGID" "DAC_OVERRIDE" "FOWNER")))) | nindent 12 }}
          resources:
            {{- toYaml .Values.postfix.resources | nindent 12 }}
          volumeMounts:
            - { name: spool, mountPath: /var/spool/postfix }
            - name: certs
              mountPath: /certs
              readOnly: {{ include "mgate.certsReadOnly" (dict "root" . "component" "postfix") }}
      volumes:
        {{- include "mgate.certsVolume" . | nindent 8 }}
      {{- with .Values.postfix.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postfix.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postfix.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: spool
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if or .Values.postfix.persistence.storageClass .Values.global.storageClass }}
        storageClassName: {{ .Values.postfix.persistence.storageClass | default .Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postfix.persistence.size }}
