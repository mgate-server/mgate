apiVersion: v1
kind: Service
metadata:
  # Bare Service name — see templates/api/service.yaml comment (hostname parity with compose: api
  # and worker reach mgate-agent's control API at "postfix:7070"; the webmail gateway submits at
  # "postfix:2587", values webmail.upstream.submissionAddr).
  name: postfix
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgate.labels" (dict "root" . "component" "postfix") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None # headless: stable DNS for the StatefulSet pod(s), matches serviceName: postfix
  selector:
    {{- include "mgate.selectorLabels" (dict "root" . "component" "postfix") | nindent 4 }}
  ports:
    - { name: agent, port: 7070, targetPort: agent, protocol: TCP }
    # Internal submission for webmail (docker/postfix master.cf service 2587). Not part of the
    # public LoadBalancer Service.
    - { name: smtp-webmail, port: 2587, targetPort: smtp-webmail, protocol: TCP }
