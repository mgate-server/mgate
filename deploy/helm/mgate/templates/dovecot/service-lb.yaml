apiVersion: v1
kind: Service
metadata:
  name: {{ include "mgate.fullname" . }}-dovecot-public
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgate.labels" (dict "root" . "component" "dovecot") | nindent 4 }}
  {{- with .Values.dovecot.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dovecot.service.type }}
  {{- if eq .Values.dovecot.service.type "LoadBalancer" }}
  externalTrafficPolicy: {{ .Values.dovecot.service.externalTrafficPolicy }}
  {{- end }}
  {{- if .Values.dovecot.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.dovecot.service.loadBalancerIP }}
  {{- end }}
  selector:
    {{- include "mgate.selectorLabels" (dict "root" . "component" "dovecot") | nindent 4 }}
  ports:
    - { name: imap, port: 143, targetPort: imap, protocol: TCP }
    - { name: imaps, port: 993, targetPort: imaps, protocol: TCP }
    - { name: pop3, port: 110, targetPort: pop3, protocol: TCP }
    - { name: pop3s, port: 995, targetPort: pop3s, protocol: TCP }
    - { name: sieve, port: 4190, targetPort: sieve, protocol: TCP }
