apiVersion: v1
kind: Service
metadata:
  # Bare Service name (not release-prefixed): postfix/dovecot/rspamd configs reference peers by
  # exactly these DNS names ("inet:api:10040" etc, same names docker-compose resolves
  # via its embedded DNS) — see README.md "Известные ограничения" (one mgate release per namespace).
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgate.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mgate.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
    # internal (8081) and policy (10040) are ClusterIP-only, never routed by Ingress; restricted
    # further by the NetworkPolicy in templates/networkpolicy.yaml.
    - { name: internal, port: 8081, targetPort: internal, protocol: TCP }
    - { name: policy, port: 10040, targetPort: policy, protocol: TCP }
