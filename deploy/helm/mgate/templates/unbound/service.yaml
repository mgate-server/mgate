apiVersion: v1
kind: Service
metadata:
  # Bare Service name — replaces the compose static IP 172.30.1.53 (MGATE_RESOLVER_IP).
  # Kubernetes has no per-Pod static-IP equivalent in a portable way; mail Pods instead resolve this Service's ClusterIP at render time and merge it into their own resolv.conf
  # — see templates/_helpers.tpl "mgate.dnsConfig" for the mechanism and its limits.
  name: unbound
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgate.labels" (dict "root" . "component" "unbound") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mgate.selectorLabels" (dict "root" . "component" "unbound") | nindent 4 }}
  ports:
    - { name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP }
