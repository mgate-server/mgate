apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mgate.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mgate.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "mgate.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mgate.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mgate.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Schema first — see the same initContainer in templates/api/deployment.yaml.
      {{- include "mgate.migrateInitContainer" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "mgate.image" (dict "root" . "repository" .Values.image.backend.repository "tag" .Values.image.backend.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # Job scheduler — ACME renewals, DNS checks, license renew loop, log
          # ingest from mgate:logs, stats rollups, retention cleanup, queue monitor. No HTTP port
          # is exposed, so no liveness/readiness probe here yet.
          # TODO(S2): once the worker exposes a health/metrics port, add probes + a Service.
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: {{ include "mgate.configMapName" . }}
            - secretRef:
                name: {{ include "mgate.secretsName" . }}
          # worker-only settings (take precedence over envFrom). See values.yaml `worker.extraEnv`.
          {{- with .Values.worker.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "mgate.securityContext" (dict "root" .) | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: {{ include "mgate.certsReadOnly" (dict "root" . "component" "worker") }}
      volumes:
        {{- include "mgate.certsVolume" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
